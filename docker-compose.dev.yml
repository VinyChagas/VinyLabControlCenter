services:
  postgres:
    image: postgres:18
    container_name: vinylab-control-postgres-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: vinylab_control
      POSTGRES_DB: vinylab_control_center
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vinylab_control_dev_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U vinylab_control -d vinylab_control_center"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vinylab_control_dev_data:
