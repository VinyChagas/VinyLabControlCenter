# VPS — frontend + backend na rede existente.
# NÃO sobe PostgreSQL — usa o container vinylab-postgres.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vinylab-control-backend:latest
    container_name: vinylab-control-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_ENV: vps
    volumes:
      - vinylab_control_secrets:/app/data
    networks:
      - vinylab_internal
      # Necessário para o backend resolver PROMETHEUS_URL=http://prometheus:9090
      - monitoring
    # Apenas localhost — Caddy fará o HTTPS na frente do frontend
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: vinylab-control-frontend:latest
    container_name: vinylab-control-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vinylab_internal
      - vinylab_proxy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  vinylab_internal:
    external: true
  vinylab_proxy:
    external: true
  monitoring:
    external: true

volumes:
  vinylab_control_secrets:
